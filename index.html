const TEST_SIZE=20;
let current=[], submitted=false;
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function norm(s){
  s=String(s).toLowerCase().replace(/½/g,' 1/2').replace(/¼/g,' 1/4').replace(/¾/g,' 3/4').replace(/⅝/g,' 5/8');
  s=s.replace(/\b(psi|ft|feet|foot|in|inch|inches|min|minutes|minute|sec|seconds|second|gal|gallons|gallon|hours|hour|hrs|sq|gpm|per|deg|°f)\b/g,'');
  return s.replace(/[^a-z0-9\/.]/g,'');
}
function fibOk(it){return it.sel!==null && it.sel.trim()!=='' && (it.override || it.acc.some(a=>norm(a)===norm(it.sel)));}
function isRight(it){return it.type==='MC' ? (it.sel!==null && it.opts[it.sel].ok) : fibOk(it);}
function isAnswered(it){return it.type==='MC' ? it.sel!==null : (it.sel!==null && it.sel.trim()!=='');}

// topic filter
[...new Set(BANK.map(q=>q.cat))].forEach(c=>{const o=document.createElement('option');o.textContent=c;o.value=c;document.getElementById('src').appendChild(o);});
document.querySelector('header p').textContent=`${TEST_SIZE} random questions (multiple choice + fill in the blank) from a ${BANK.length}-question bank • NFPA 13 (2016), 13D/13R, 14, 20, 22, 24, 25 and MN licensing • Study aid only – verify against your books`;

function newTest(){
  submitted=false;
  const f=document.getElementById('src').value, t=document.getElementById('typ').value;
  const pool=shuffle(BANK.filter(q=>(f==='ALL'||q.cat===f)&&(t==='ALL'||q.type===t)));
  current=pool.slice(0,Math.min(TEST_SIZE,pool.length)).map(q=>{
    if(q.type==='MC'){
      const opts=shuffle(q.opts.map((t,i)=>({t,ok:i===0})));
      return {type:'MC',cat:q.cat,q:q.q,opts,expl:q.expl,sel:null};
    }
    return {type:'FIB',cat:q.cat,q:q.q,acc:q.acc,disp:q.disp,expl:q.expl,sel:null,override:false};
  });
  render(); window.scrollTo(0,0);
}

function render(){
  const quiz=document.getElementById('quiz'); quiz.innerHTML='';
  current.forEach((it,i)=>{
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<div class="tag">${esc(it.cat)} • Question ${i+1}<span class="badge">${it.type==='MC'?'Multiple choice':'Fill in the blank'}</span></div><div class="q">${esc(it.q)}</div>`;
    if(it.type==='MC'){
      it.opts.forEach((o,j)=>{
        const l=document.createElement('label');
        l.innerHTML=`<input type="radio" name="q${i}" value="${j}" ${it.sel===j?'checked':''} ${submitted?'disabled':''}> ${String.fromCharCode(65+j)}. ${esc(o.t)}`;
        l.querySelector('input').onchange=()=>{it.sel=j;updateProgress();};
        if(submitted){ if(o.ok) l.classList.add('correct'); else if(it.sel===j) l.classList.add('wrong'); }
        d.appendChild(l);
      });
    } else {
      const inp=document.createElement('input'); inp.type='text'; inp.placeholder='Type your answer…'; inp.value=it.sel||''; inp.disabled=submitted;
      inp.oninput=()=>{it.sel=inp.value;updateProgress();};
      if(submitted) inp.classList.add(fibOk(it)?'correct':'wrong');
      d.appendChild(inp);
    }
    if(submitted){
      const right=isRight(it);
      const e=document.createElement('div'); e.className='expl';
      const ans=it.type==='FIB'?` Answer: <b>${esc(it.disp)}</b>.`:'';
      e.innerHTML=`<b>${!isAnswered(it)?'Unanswered':right?'Correct':'Incorrect'}.</b>${ans} ${esc(it.expl)}`;
      if(it.type==='FIB' && !right){
        const b=document.createElement('button'); b.className='alt small'; b.textContent='Mark my answer correct';
        b.onclick=()=>{it.override=true; showResult(); render2();};
        e.appendChild(document.createElement('br')); e.appendChild(b);
      }
      d.appendChild(e);
    }
    quiz.appendChild(d);
  });
  const a=document.getElementById('actions');
  if(!submitted){ a.innerHTML='<button id="sub">Submit for Grading</button>'; document.getElementById('sub').onclick=grade; }
  updateProgress();
}
function render2(){ const y=window.scrollY; render(); showResult(); window.scrollTo(0,y); }

function updateProgress(){
  const n=current.filter(isAnswered).length;
  document.getElementById('progress').textContent=submitted?'Graded':`Answered ${n} of ${current.length}`;
}
function showResult(){
  const score=current.filter(isRight).length, pct=Math.round(score/current.length*100);
  const a=document.getElementById('actions');
  a.innerHTML=`<div id="result">Score: ${score} / ${current.length} (${pct}%) <span class="${pct>=70?'pass':'fail'}">${pct>=70?'PASS (70%+)':'Below 70% – keep studying'}</span></div>
    <p>Review the highlighted answers and explanations above. Fill-in answers that are right but worded differently can be marked correct.</p>
    <button id="again">Take a New Test</button> <button class="alt" id="top">Back to Top</button>`;
  document.getElementById('again').onclick=newTest;
  document.getElementById('top').onclick=()=>window.scrollTo(0,0);
}
function grade(){
  const un=current.filter(c=>!isAnswered(c)).length;
  if(un&&!confirm(`${un} question(s) unanswered. Submit anyway?`)) return;
  submitted=true; render(); showResult();
  document.getElementById('actions').scrollIntoView({behavior:'smooth'});
}
document.getElementById('src').onchange=newTest;
document.getElementById('typ').onchange=newTest;
newTest();
</script>
